<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Годовой отчёт 2024</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
  --green:#5F723B;
  --green-hover:#70884A;
  --cream:#FBFAF6;
  --text:#2F241D;
  --muted:#8B8278;
  --white:#FCFAF4;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  font-family:Lato,Arial,sans-serif;
  color:var(--text);
}

.pk-toolbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 22px;
  background:var(--green);
  color:var(--white);
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.pk-title{
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
}

.pk-controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.pk-btn{
  border:0;
  background:var(--white);
  color:var(--green);
  padding:9px 15px;
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}

.pk-btn:hover{
  background:#ECE8DD;
}

.pk-info{
  min-width:92px;
  text-align:center;
  font-size:14px;
  color:var(--white);
}

.pk-download{
  color:#FCFAF4;
  background:rgba(252,250,244,.14);
  text-decoration:none;
  border:1px solid rgba(252,250,244,.42);
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.pk-download:hover{
  background:rgba(252,250,244,.24);
  border-color:rgba(252,250,244,.65);
}

.pk-wrap{
  width:100%;
  margin:32px auto;
  padding:0 18px 50px;
  text-align:center;
  overflow:auto;
}

canvas{
  display:block;
  margin:0 auto;
  width:auto;
  height:auto;
  max-width:none;
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 45px rgba(0,0,0,.14);
}

.pk-loader{
  padding:80px 20px;
  color:var(--muted);
  font-size:18px;
}

@media(max-width:760px){
  .pk-toolbar{
    flex-direction:column;
    align-items:stretch;
    padding:12px;
  }

  .pk-title{
    text-align:center;
    white-space:normal;
    font-size:15px;
  }

  .pk-controls{
    justify-content:center;
    flex-wrap:wrap;
  }

  .pk-btn,.pk-download{
    font-size:13px;
    padding:8px 12px;
  }

  .pk-wrap{
    margin:18px auto;
    padding:0 10px 35px;
  }

  canvas{
    max-width:100%;
    height:auto;
    border-radius:12px;
  }
}
</style>
</head>

<body>

<div class="pk-toolbar">
  <div class="pk-title">Годовой отчёт фонда за 2024 год</div>

  <div class="pk-controls">
    <button class="pk-btn" id="prev">←</button>
    <div class="pk-info"><span id="page_num">1</span> / <span id="page_count">—</span></div>
    <button class="pk-btn" id="next">→</button>
    <button class="pk-btn" id="zoomOut">−</button>
    <button class="pk-btn" id="zoomIn">+</button>
    <a class="pk-download" href="report-2024.pdf.pdf" target="_blank">Скачать PDF</a>
  </div>
</div>

<div class="pk-wrap">
  <div class="pk-loader" id="loader">Загружаем отчёт...</div>
  <canvas id="pdf-canvas" style="display:none;"></canvas>
</div>

<script>
const url = 'report-2024.pdf.pdf';

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let pageNum = 1;
let scale = 0.6;
let isRendering = false;
let pendingRender = false;

const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');
const loader = document.getElementById('loader');

function renderPage(num){
  if(!pdfDoc) return;

  if(isRendering){
    pendingRender = true;
    return;
  }

  isRendering = true;

  pdfDoc.getPage(num).then(page=>{
    const containerWidth = document.querySelector('.pk-wrap').clientWidth - 40;
    const firstViewport = page.getViewport({ scale: 1 });
    const fitScale = containerWidth / firstViewport.width;

    const viewport = page.getViewport({
      scale: fitScale * scale
    });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    page.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise.then(()=>{
      document.getElementById('page_num').textContent = pageNum;
      loader.style.display = 'none';
      canvas.style.display = 'block';
      isRendering = false;

      if(pendingRender){
        pendingRender = false;
        renderPage(pageNum);
      }
    });
  });
}

pdfjsLib.getDocument(url).promise.then(pdf=>{
  pdfDoc = pdf;
  document.getElementById('page_count').textContent = pdf.numPages;
  renderPage(pageNum);
}).catch(()=>{
  loader.textContent = 'Не удалось загрузить PDF. Проверьте имя файла.';
});

document.getElementById('prev').onclick = ()=>{
  if(!pdfDoc || pageNum <= 1) return;
  pageNum--;
  renderPage(pageNum);
};

document.getElementById('next').onclick = ()=>{
  if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
  pageNum++;
  renderPage(pageNum);
};

document.getElementById('zoomIn').onclick = ()=>{
  scale += 0.1;
  renderPage(pageNum);
};

document.getElementById('zoomOut').onclick = ()=>{
  if(scale <= 0.35) return;
  scale -= 0.1;
  renderPage(pageNum);
};

document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowLeft') document.getElementById('prev').click();
  if(e.key === 'ArrowRight') document.getElementById('next').click();
});
</script>

</body>
</html>
